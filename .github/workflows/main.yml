# Publish a Foundry VTT module release.
#
# The archive must contain every path the manifest declares. Foundry checks
# this at install time and refuses the package with `PACKAGE.InstallFailed`
# when one is missing, so this workflow unpacks its own archive and validates
# it before the release is updated.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The tag is the single source of truth for the version.
      # Accepts "v1.2.3" and "1.2.3".
      - name: Resolve version from the tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version."
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Write the release values into the manifest. `manifest` keeps pointing at
      # "latest" so Foundry can detect future updates; `download` points at this
      # exact tag.
      - name: Stamp the manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          jq --arg version "$VERSION" \
             --arg url "$REPO_URL" \
             --arg manifest "$REPO_URL/releases/latest/download/module.json" \
             --arg download "$REPO_URL/releases/download/$TAG/module.zip" \
             '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.stamped.json
          mv module.stamped.json module.json
          cat module.json

      - name: Validate the source tree
        run: node .github/scripts/validate-manifest.mjs .

      - name: Run the rule tests
        run: node .github/scripts/test-rules.mjs

      # Only the files the module needs at runtime. Every entry must exist:
      # `zip` merely warns on a missing path, so the list is checked first.
      - name: Create the module archive
        run: |
          CONTENTS=(
            module.json
            README.md
            LICENSE
            NOTICE.md
            scripts
            styles
            templates
            languages
          )
          MISSING=0
          for path in "${CONTENTS[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Archive content '$path' does not exist in the repository."
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          # `packs` is optional: include it only when the module ships compendia.
          [ -d packs ] && CONTENTS+=(packs)

          # Leftovers of the module template that no manifest entry points at.
          zip --recurse-paths ./module.zip "${CONTENTS[@]}" \
            --exclude 'scripts/module.js' \
            --exclude 'scripts/lib/*' \
            --exclude 'styles/module.css'

      # The real guard against the missing-file install error: validate the
      # archive itself, not the repository.
      - name: Validate the archive
        run: |
          unzip -q -o ./module.zip -d ./verify
          node .github/scripts/validate-manifest.mjs ./verify
          echo "--- archive contents ---"
          unzip -l ./module.zip

      - name: Attach the files to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          artifacts: "./module.json,./module.zip"
